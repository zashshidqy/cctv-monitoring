# Site Configuration for O!Save Monitor on Render

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content Security Policy
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'wasm-unsafe-eval';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' data: https://fonts.gstatic.com;
        img-src 'self' data: https://tile.openstreetmap.org https://api.maptiler.com https://*.maptiler.com;
        connect-src 'self' https://tile.openstreetmap.org https://api.maptiler.com https://*.maptiler.com wss:;
        frame-ancestors 'self';
        form-action 'self';
        base-uri 'self';
    " always;

    # HSTS (uncomment when using HTTPS)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip static files
    gzip_static on;

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Laravel public files
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP processing
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 90s;
        fastcgi_send_timeout 90s;
        fastcgi_connect_timeout 30s;

        # Security
        fastcgi_param PHP_VALUE "expose_php=off";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~* \.(env|log|sql|sqlite|bak|backup)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to storage and bootstrap cache (should not be directly accessible)
    location ~* ^/(storage|bootstrap/cache)/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # API rate limiting zone (optional - configure in render.yaml or via middleware)
    # limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # location /api/ { limit_req zone=api burst=20 nodelay; }
}